name: Build Kernel Zips

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        device: [pdx235, pdx235_j, pdx225]

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.device }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.device }}-

    - name: Cache Clang Toolchain
      uses: actions/cache@v4
      with:
        path: toolchains/clang-r563880c
        key: ${{ runner.os }}-clang-r563880c

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Build Kernel
      run: |
        ./build.sh ${{ matrix.device }}
        
    - name: Clean Build Tree for Upload
      run: |
        cd build
        # Clear out ALL heavy scaffolding and intermediate compiler text files
        find . \( \
            -name '*.[ao]' \
            -o -name '*.mod.o' \
            -o -name '*.*.symversions' \
            -o -name '*.dwo' \
            -o -name '*.su' \
            -o -name '*.mod' \
            -o -name '*.lst' \
            -o -name '*.ll' \
            -o -name '.*.d' \
            -o -name '.*.cmd' \
            -o -name '.*.tmp' \
        \) -type f -delete
        
        # Sweep away any empty folders left behind
        find . -type d -empty -delete
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Build-Tree-${{ matrix.device }}
        path: build/
